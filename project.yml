name: Glance
options:
  deploymentTarget:
    iOS: "17.0"

targets:
  Glance:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Glance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.glance.ios
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Glance/Info.plist
    entitlements:
      path: Glance.entitlements
      properties:
        com.apple.developer.aps-environment: development
    info:
      path: Glance/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        NSUserNotificationUsageDescription: "Glance delivers notifications from your configured backends."
        BGTaskSchedulerPermittedIdentifiers:
          - dev.glance.ios.poll
        UIBackgroundModes:
          - fetch
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
